<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VyneHaus">
  <!-- A vine leaf. The vine is the oldest image the church has for belonging to one
       another - "I am the vine, you are the branches" - and it belongs to no single
       tradition, which matters for a directory that holds all of them.
       Filled rather than drawn: an outline closes into a blob at 16 pixels. -->
  <rect width="32" height="32" rx="7" fill="#4A7C10"/>
  <path d="M16 4.6c8.4 5.4 11 11.2 7.6 15.1-1.9 2.2-4.4 3.3-7.6 3.5-3.2-.2-5.7-1.3-7.6-3.5C5 15.8 7.6 10 16 4.6Z"
        fill="#FBFDF2"/>
  <path d="M16 24v3.4" stroke="#FBFDF2" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M16 10.4v10.4" stroke="#4A7C10" stroke-width="1.4" stroke-linecap="round"/>
</svg>
